name: "One-Click AWS Infra Manager"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - plan
          - destroy
      aws_region:
        description: "Target AWS Region"
        required: true
        default: "us-east-1"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: "Terraform ${{ github.event.inputs.action }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Debug Step: Extract and print the exact claims GitHub is sending to AWS
      - name: Inspect GitHub OIDC Token Claims
        run: |
          echo "=== Fetching OIDC Token from GitHub Token Service ==="
          RAW_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          
          echo "=== Decoded Token Payload (Claims sent to AWS STS) ==="
          echo "$RAW_TOKEN" | jq -R 'split(".") | .[1] | @base64d | fromjson'

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ github.event.inputs.aws_region }}
          role-to-assume: arn:aws:iam::650694421089:role/github-actions-infra-deployer
          role-session-name: GHA-Alamgir-${{ github.run_id }}

      - name: Verify STS Caller Identity
        run: |
          echo "Authenticated to AWS as:"
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        working-directory: ./terraform
        run: terraform plan -var="aws_region=${{ github.event.inputs.aws_region }}"

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: ./terraform
        run: |
          terraform apply -var="aws_region=${{ github.event.inputs.aws_region }}" -auto-approve
          echo "### Infrastructure Deployed Successfully! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Public URL: $(terraform output -raw web_public_url)" >> $GITHUB_STEP_SUMMARY

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: ./terraform
        run: terraform destroy -var="aws_region=${{ github.event.inputs.aws_region }}" -auto-approve
